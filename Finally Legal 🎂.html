<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Finally Legal 🎂</title>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#1a0b2e;--bg2:#2d1457;--card:#3b1c73;--lilac:#c9a7ff;--violet:#8b5cf6;--pink:#f0abfc;--gold:#ffd166;--text:#f5ecff;
color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a0b2e}}
:root[data-theme="dark"]{--bg:#1a0b2e}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,var(--bg2),var(--bg) 70%) var(--bg);color:var(--text);font-family:'Nunito',system-ui,sans-serif;text-align:center;overflow-x:hidden}
main{max-width:640px;margin:0 auto;padding:28px 18px 60px}
h1{font-family:'Bagel Fat One','Arial Rounded MT Bold',system-ui,sans-serif;font-weight:400;font-size:clamp(2.4rem,11vw,4.2rem);line-height:1.05;margin:8px 0 10px;color:var(--pink);text-shadow:0 4px 0 var(--violet)}
h2{font-family:'Bagel Fat One',system-ui,sans-serif;font-weight:400;font-size:1.5rem;margin:44px 0 6px;color:var(--lilac)}
p{margin:6px 0 16px;color:#e4d3ff;font-size:1.05rem}
.name-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:14px 0}
input{font:inherit;font-weight:700;padding:12px 16px;border-radius:14px;border:2px solid var(--violet);background:var(--card);color:var(--text);width:min(220px,60%);text-align:center}
input::placeholder{color:#a98bd9}
input[type=number]{width:90px}
button{font:inherit;font-weight:700;cursor:pointer;border:0;border-radius:14px;padding:12px 20px;background:var(--violet);color:#fff;transition:transform .15s,background .15s}
button:hover{background:#a078ff;transform:translateY(-2px)}
button:active{transform:scale(.96)}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
/* cake */
.cake{position:relative;width:260px;height:230px;margin:50px auto 0}
.tier{position:absolute;left:50%;transform:translateX(-50%);border-radius:14px 14px 10px 10px}
.t1{bottom:0;width:260px;height:80px;background:var(--violet)}
.t2{bottom:80px;width:190px;height:70px;background:var(--lilac)}
.drip{position:absolute;top:0;left:0;right:0;height:22px;border-radius:14px 14px 0 0;background:#fff;opacity:.9}
.t1 .drip{background:var(--pink)}
.candles{position:absolute;bottom:150px;left:50%;transform:translateX(-50%);display:flex;gap:16px}
.candle{position:relative;width:14px;height:52px;border:0;padding:0;border-radius:4px;background:repeating-linear-gradient(45deg,var(--gold) 0 8px,#fff 8px 16px)}
.candle:hover{transform:none;background:repeating-linear-gradient(45deg,var(--gold) 0 8px,#fff 8px 16px)}
.flame{position:absolute;left:50%;top:-24px;width:14px;height:22px;margin-left:-7px;background:radial-gradient(#fff 15%,var(--gold) 45%,#ff8a3d);border-radius:50% 50% 50% 50%/65% 65% 35% 35%;transform-origin:50% 100%;animation:flick .5s infinite alternate;transition:opacity .25s,transform .25s}
.candle.out .flame{opacity:0;transform:scale(.2);animation:none}
.candle.out::after{content:"";position:absolute;left:50%;top:-40px;width:6px;height:30px;margin-left:-3px;border-radius:50%;background:rgba(255,255,255,.35);animation:smoke 1.2s forwards}
@keyframes flick{from{transform:scale(1) rotate(-3deg)}to{transform:scale(1.08,.94) rotate(3deg)}}
@keyframes smoke{to{transform:translateY(-30px) scale(2);opacity:0}}
#status{min-height:1.6em;margin-top:16px;font-weight:700;color:var(--gold)}
/* wish */
#wish{display:none;margin:20px auto 0;max-width:420px;background:var(--card);border:2px solid var(--pink);border-radius:20px;padding:18px 20px;font-size:1.15rem}
#wish.show{display:block;animation:pop .4s}
@keyframes pop{from{transform:scale(.8);opacity:0}}
/* balloons */
.balloons{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;margin-top:20px}
.balloon{width:64px;height:78px;padding:0;border-radius:50% 50% 50% 50%/58% 58% 42% 42%;position:relative;font-size:1.4rem;animation:bob 3s ease-in-out infinite}
.balloon::after{content:"";position:absolute;left:50%;top:100%;width:2px;height:26px;background:var(--lilac);opacity:.6}
.balloon:nth-child(2n){animation-delay:-1s}.balloon:nth-child(3n){animation-delay:-2s}
.balloon:hover{transform:none}
.balloon.popped{animation:none;opacity:0;transform:scale(1.6);pointer-events:none;transition:.25s}
@keyframes bob{50%{translate:0 -10px}}
#note{min-height:3.2em;margin-top:34px;font-size:1.2rem;font-weight:700;color:var(--pink)}

.show{position:relative;width:min(340px,86vw);aspect-ratio:4/5;margin:18px auto 22px;border-radius:24px;overflow:hidden;border:4px solid var(--pink);box-shadow:0 12px 0 var(--violet),0 24px 50px rgba(0,0,0,.4);background:var(--card)}
.slides{position:absolute;inset:0}
.slide{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .7s}
.slide.on{opacity:1}
.nav{position:absolute;top:50%;translate:0 -50%;width:42px;height:42px;padding:0;border-radius:50%;font-size:1.6rem;line-height:1;background:rgba(26,11,46,.55)}
.prev{left:8px}.next{right:8px}
.nav:hover{transform:none;background:rgba(139,92,246,.85)}
.dots{position:absolute;bottom:10px;left:0;right:0;display:flex;gap:8px;justify-content:center}
.dot{width:10px;height:10px;padding:0;border-radius:50%;background:rgba(255,255,255,.5)}
.dot.on{background:var(--gold)}
.dot:hover{transform:none}
.big{font-size:1.15rem;padding:16px 26px;background:var(--pink);color:var(--bg);box-shadow:0 5px 0 var(--violet)}
.big:hover{background:#f5c4ff}
#msg{display:none;text-align:left;margin:24px auto 0;max-width:520px;background:var(--card);border:2px solid var(--pink);border-radius:22px;padding:22px 22px 8px}
#msg.show{display:block;animation:pop .5s cubic-bezier(.3,1.5,.5,1)}
#msg p{white-space:pre-line;margin:0 0 16px;color:var(--text);line-height:1.6}
#intro{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;flex-direction:column;background:radial-gradient(circle at 50% 40%,var(--bg2),var(--bg) 75%) var(--bg);transition:opacity .8s;perspective:600px;cursor:pointer}
#intro.gone{opacity:0;pointer-events:none}
#intro svg{width:150px;height:150px;animation:spin 1.6s linear infinite,glow 1.6s ease-in-out infinite alternate}
#intro span{margin-top:26px;font-family:'Bagel Fat One',system-ui,sans-serif;font-size:1.2rem;color:var(--lilac)}
@keyframes spin{to{transform:rotateY(360deg)}}
@keyframes glow{from{filter:drop-shadow(0 0 10px rgba(139,92,246,.6))}to{filter:drop-shadow(0 0 30px rgba(240,171,252,.95))}}
canvas{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:5}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

    <button class="nav prev" id="prev" aria-label="Previous photo">‹</button>
    <button class="nav next" id="next" aria-label="Next photo">›</button>
    <div class="dots" id="dots"></div>
  </div>
  <button id="msgBtn" class="big">Open your birthday message 🎉</button>
  <div id="msg" role="region" aria-label="Birthday message"></div>

  <div class="cake" aria-label="Birthday cake">
    <div class="candles" id="candles"></div>
    <div class="tier t2"><div class="drip"></div></div>
    <div class="tier t1"><div class="drip"></div></div>
  </div>
  <div id="status">Tap each candle to blow it out</div>
  <button id="relight" hidden>Relight candles</button>
  <div id="wish" role="status"></div>

  <h2>Pop a balloon</h2>
  <p>Each one holds a birthday message.</p>
  <div class="balloons" id="balloons"></div>
  <div id="note" role="status"></div>
</main>
<script>
(function(){
  var name='', cols=['#8b5cf6','#c084fc','#f0abfc','#a78bfa','#7c3aed','#d8b4fe'];
  var wishes=['May this year bring you everything you’re hoping for.','Here’s to big laughs and small adventures.','Wishing you a year full of good surprises.','May your next trip around the sun be your best yet.','You deserve cake, joy and a very long nap.'];
  var notes=['Another year of being wonderful.','Cake first, questions later.','You make the world brighter.','Today is all about you.','Age is just a number. A big, purple number.','Make a wish. Then make it happen.'];
  var $=function(i){return document.getElementById(i)};
  var candlesEl=$('candles'), count=5, lit=0;

  function buildCandles(){
    candlesEl.innerHTML=''; lit=count;
    for(var i=0;i<count;i++){
      var c=document.createElement('button');
      c.className='candle'; c.setAttribute('aria-label','Blow out candle '+(i+1));
      c.innerHTML='<span class="flame"></span>';
      c.addEventListener('click',snuff);
      candlesEl.appendChild(c);
    }
    $('status').textContent='Tap each candle to blow it out';
    $('relight').hidden=true; $('wish').className='';
  }
  function snuff(e){
    var c=e.currentTarget; if(c.classList.contains('out'))return;
    c.classList.add('out'); lit--;
    if(lit>0){$('status').textContent=lit+' to go…';return;}
    $('status').textContent='Wish granted!';
    $('wish').textContent=wishes[Math.floor(Math.random()*wishes.length)];
    $('wish').className='show'; $('relight').hidden=false;
    burst(innerWidth/2,innerHeight*0.4,160);
  }
  $('relight').addEventListener('click',buildCandles);

  var b=$('balloons');
  for(var i=0;i<6;i++){
    (function(i){
      var el=document.createElement('button');
      el.className='balloon'; el.style.background=cols[i]; 
      el.setAttribute('aria-label','Pop balloon '+(i+1));
      el.addEventListener('click',function(){
        var r=el.getBoundingClientRect();
        el.classList.add('popped');
        burst(r.left+r.width/2,r.top+r.height/2,40,cols[i]);
        $('note').textContent=(name?name+': ':'')+notes[i];
      });
      b.appendChild(el);
    })(i);
  }

  /* confetti */
  var cv=$('fx'),ctx=cv.getContext('2d'),ps=[],run=false;
  function size(){cv.width=innerWidth;cv.height=innerHeight}
  size(); addEventListener('resize',size);
  function burst(x,y,n,col){
    if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;
    var pal=col?[col,'#fff']:['#c9a7ff','#f0abfc','#ffd166','#8b5cf6','#fff'];
    for(var i=0;i<n;i++){
      var a=Math.random()*Math.PI*2,s=3+Math.random()*7;
      ps.push({x:x,y:y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-4,w:5+Math.random()*6,h:3+Math.random()*5,r:Math.random()*6,vr:Math.random()*.4-.2,c:pal[i%pal.length],l:90+Math.random()*50});
    }
    if(!run){run=true;requestAnimationFrame(tick)}
  }
  function tick(){
    ctx.clearRect(0,0,cv.width,cv.height);
    ps=ps.filter(function(p){return p.l>0&&p.y<cv.height+20});
    ps.forEach(function(p){
      p.vy+=.25;p.vx*=.99;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.l--;
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.globalAlpha=Math.min(1,p.l/30);ctx.fillRect(-p.w/2,-p.h/2,p.w,p.h);ctx.restore();
    });
    if(ps.length)requestAnimationFrame(tick);else run=false;
  }

  /* intro heart */
  var intro=$('intro'),introDone=false;
  function closeIntro(){
    if(introDone)return;introDone=true;intro.classList.add('gone');
    setTimeout(function(){burst(innerWidth/2,innerHeight*0.2,90)},300);
  }
  intro.addEventListener('click',closeIntro);
  setTimeout(closeIntro,3200);

  /* slideshow */
  var sl=document.querySelectorAll('.slide'),dots=$('dots'),cur=0,timer;
  sl.forEach(function(_,i){var d=document.createElement('button');d.className='dot'+(i?'':' on');d.setAttribute('aria-label','Photo '+(i+1));d.onclick=function(){go(i,true)};dots.appendChild(d)});
  function go(n,manual){
    cur=(n+sl.length)%sl.length;
    sl.forEach(function(x,i){x.classList.toggle('on',i===cur)});
    dots.childNodes.forEach(function(x,i){x.classList.toggle('on',i===cur)});
    if(manual)start();
  }
  function start(){clearInterval(timer);if(!matchMedia('(prefers-reduced-motion:reduce)').matches)timer=setInterval(function(){go(cur+1)},4000)}
  $('prev').onclick=function(){go(cur-1,true)};
  $('next').onclick=function(){go(cur+1,true)};
  var sx=null,sh=document.querySelector('.show');
  sh.addEventListener('touchstart',function(e){sx=e.touches[0].clientX},{passive:true});
  sh.addEventListener('touchend',function(e){if(sx===null)return;var dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>40)go(cur+(dx<0?1:-1),true);sx=null});
  start();

  /* birthday message */
  var paras=[
   "Happy birthday princess❤️\n💐🥰 Wishing you a beautiful day filled with love, laughter, and all the happiness you deserve. May this new year of your life bring you countless blessings, wonderful memories, and exciting new adventures. May you continue to shine, grow, and inspire those around you with your beautiful spirit. Here’s to another year of life, joy, good health, and unforgettable moments. Have an absolutely wonderful birthday and a truly blessed year ahead! 😀😍❤️🎂✨",
   "I hope this new year of your life brings you so much happiness, love, peace, success and beautiful memories. 🥺❤️ You are such a beautiful soul, I’m genuinely so grateful that our paths crossed. 🥹🤏🏽\nMay this chapter be filled with answered prayers, exciting opportunities, growth and everything your heart has been wishing for. You deserve to be celebrated, appreciated and loved today and always. 🥳❤️",
   "I hope you have the most amazing birthday, superstar! ❤️🥺🌸 Keep shining, keep being you, and may this year be your BEST one yet! 🎊🎉",
   "Love you lots! ❤️ Happy birthday, ngwanyawaaka!"];
  var m=$('msg');
  paras.forEach(function(t){var p=document.createElement('p');p.textContent=t;m.appendChild(p)});
  var mb=$('msgBtn');
  mb.addEventListener('click',function(){
    var r=mb.getBoundingClientRect();
    m.className='show';
    burst(r.left+r.width/2,r.top+r.height/2,180);
    [150,350,550].forEach(function(t,i){setTimeout(function(){burst(innerWidth*(.2+.3*i),innerHeight*.35,90)},t)});
    mb.textContent='Pop it again 🎊';
    setTimeout(function(){m.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion:reduce)').matches?'auto':'smooth',block:'start'})},300);
  });
  buildCandles();
})();
</script>
</body>
</html>
