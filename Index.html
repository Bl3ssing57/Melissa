<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Finally Legal 🎂</title>
<link href="https://fonts.googleapis.com/css2?family=Bagel+Fat+One&family=Nunito:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#1a0b2e;--bg2:#2d1457;--card:#3b1c73;--lilac:#c9a7ff;--violet:#8b5cf6;--pink:#f0abfc;--gold:#ffd166;--text:#f5ecff;
color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a0b2e}}
:root[data-theme="dark"]{--bg:#1a0b2e}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 0,var(--bg2),var(--bg) 70%) var(--bg);color:var(--text);font-family:'Nunito',system-ui,sans-serif;text-align:center;overflow-x:hidden}
main{max-width:640px;margin:0 auto;padding:28px 18px 60px}
h1{font-family:'Bagel Fat One','Arial Rounded MT Bold',system-ui,sans-serif;font-weight:400;font-size:clamp(2.4rem,11vw,4.2rem);line-height:1.05;margin:8px 0 10px;color:var(--pink);text-shadow:0 4px 0 var(--violet)}
h2{font-family:'Bagel Fat One',system-ui,sans-serif;font-weight:400;font-size:1.5rem;margin:44px 0 6px;color:var(--lilac)}
p{margin:6px 0 16px;color:#e4d3ff;font-size:1.05rem}
.name-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:14px 0}
input{font:inherit;font-weight:700;padding:12px 16px;border-radius:14px;border:2px solid var(--violet);background:var(--card);color:var(--text);width:min(220px,60%);text-align:center}
input::placeholder{color:#a98bd9}
input[type=number]{width:90px}
button{font:inherit;font-weight:700;cursor:pointer;border:0;border-radius:14px;padding:12px 20px;background:var(--violet);color:#fff;transition:transform .15s,background .15s}
button:hover{background:#a078ff;transform:translateY(-2px)}
button:active{transform:scale(.96)}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
/* cake */
.cake{position:relative;width:260px;height:230px;margin:50px auto 0}
.tier{position:absolute;left:50%;transform:translateX(-50%);border-radius:14px 14px 10px 10px}
.t1{bottom:0;width:260px;height:80px;background:var(--violet)}
.t2{bottom:80px;width:190px;height:70px;background:var(--lilac)}
.drip{position:absolute;top:0;left:0;right:0;height:22px;border-radius:14px 14px 0 0;background:#fff;opacity:.9}
.t1 .drip{background:var(--pink)}
.candles{position:absolute;bottom:150px;left:50%;transform:translateX(-50%);display:flex;gap:16px}
